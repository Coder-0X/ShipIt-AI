name: ShipIt AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./web

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Tests
      run: npm run test
      
    - name: Build Project
      run: npm run build
      env:
        # Provide mock values so the build doesn't crash from missing env vars
        GEMINI_API_KEY: 'mock-key'
        STRIPE_SECRET_KEY: 'mock-key'
        NEXT_PUBLIC_SUPABASE_URL: 'https://mock.supabase.co'
        NEXT_PUBLIC_SUPABASE_ANON_KEY: 'mock-key'
        SUPABASE_SERVICE_ROLE_KEY: 'mock-key'
