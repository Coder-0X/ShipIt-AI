<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ShipIt AI Side Panel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #09090b;
      color: #f4f4f5;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      color: #34d399; /* emerald-400 */
    }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #e4e4e7;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 12px;
    }
    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #27272a;
      background-color: #18181b;
      color: #e4e4e7;
      margin-bottom: 12px;
      cursor: pointer;
    }
    button {
      background-color: #34d399;
      color: #064e3b;
      font-weight: bold;
      border: none;
    }
    button:hover {
      background-color: #10b981;
    }
    button:disabled {
      background-color: #064e3b;
      color: #a7f3d0;
      cursor: not-allowed;
    }
    #resultArea {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #27272a;
    }
    #resultContent {
      width: 100%;
      height: 200px;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #e4e4e7;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
    }
  </style>
</head>
<body>
  <h1>ShipIt AI</h1>
  <textarea id="inputText" placeholder="Highlight text on a page, or type it here..."></textarea>
  
  <select id="toneSelect">
    <option value="hype">Hype (Twitter/X style)</option>
    <option value="pro">Professional (LinkedIn style)</option>
    <option value="tech">Technical (Changelog style)</option>
  </select>

  <button id="generateBtn">Rewrite Text</button>

  <div id="resultArea">
    <label style="font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 4px;">Result:</label>
    <textarea id="resultContent" readonly></textarea>
    <button id="copyBtn" style="margin-top: 8px; background-color: #27272a; color: white;">Copy to Clipboard</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
