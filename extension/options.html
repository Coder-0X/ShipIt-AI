<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ShipIt AI - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #34d399;
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .card {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background-color: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      color: #f4f4f5;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: #34d399;
    }
    button {
      background-color: #34d399;
      color: #064e3b;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #10b981;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #34d399;
      display: none;
    }
    a {
      color: #34d399;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>ShipIt AI Settings</h1>
  <p>To use the ShipIt AI extension, you must connect it to your account by providing your personal API Key.</p>

  <div class="card">
    <label for="apiKey">Your API Key</label>
    <input type="password" id="apiKey" placeholder="sk_live_..." autocomplete="off">
    
    <label for="apiUrl" style="margin-top: 16px;">API Server URL (optional)</label>
    <input type="text" id="apiUrl" placeholder="https://shipit-ai.example.com/api/generate" autocomplete="off">
    
    <button id="saveBtn">Save Configuration</button>
    <div id="status">Settings saved successfully!</div>
    
    <p style="margin-top: 24px; font-size: 13px;">
      Don't have an API key? Generate one in your <a href="http://localhost:3000/dashboard" target="_blank">Developer Dashboard</a>.
    </p>
  </div>

  <script src="options.js"></script>
</body>
</html>
