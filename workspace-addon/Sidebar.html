<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        padding: 16px;
        color: #333;
        background-color: #fafafa;
      }
      h2 {
        font-size: 16px;
        color: #10b981;
        margin-top: 0;
      }
      p {
        font-size: 13px;
        color: #666;
        line-height: 1.4;
      }
      .form-group {
        margin-top: 20px;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #444;
      }
      select {
        width: 100%;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #ddd;
        font-family: 'Inter', sans-serif;
        font-size: 13px;
      }
      button {
        width: 100%;
        background-color: #10b981;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
      }
      button:hover {
        background-color: #059669;
      }
      button:disabled {
        background-color: #a7f3d0;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        font-size: 12px;
        font-weight: 600;
        padding: 8px;
        border-radius: 4px;
        display: none;
      }
      .success { background-color: #d1fae5; color: #065f46; }
      .error { background-color: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <h2>ShipIt AI</h2>
    <p>Highlight text in your document, select a tone below, and click Generate. The rewritten text will be appended to your document.</p>
    
    <div class="form-group">
      <label for="tone">Target Audience / Tone</label>
      <select id="tone">
        <option value="exec">Executive Summary (Email)</option>
        <option value="pro">Professional (LinkedIn)</option>
        <option value="tech">Engineering (Changelog)</option>
        <option value="hype">Hype (Twitter)</option>
      </select>
    </div>
    
    <button id="generateBtn" onclick="onGenerateClick()">Rewrite Selection</button>
    
    <div id="status"></div>
    
    <div style="margin-top: 24px; text-align: center;">
      <a href="#" onclick="google.script.run.openSettings()" style="color: #666; font-size: 12px; text-decoration: none;">⚙️ Settings (API Key)</a>
    </div>
    
    <script>
      function onGenerateClick() {
        const btn = document.getElementById('generateBtn');
        const statusDiv = document.getElementById('status');
        const tone = document.getElementById('tone').value;
        
        btn.disabled = true;
        btn.innerText = 'Generating...';
        statusDiv.style.display = 'none';
        
        // google.script.run executes a server-side function defined in Code.gs
        google.script.run
          .withSuccessHandler(function(result) {
            btn.disabled = false;
            btn.innerText = 'Rewrite Selection';
            
            statusDiv.style.display = 'block';
            if (result.success) {
              statusDiv.className = 'success';
              statusDiv.innerText = 'Success! Text appended to document.';
            } else {
              statusDiv.className = 'error';
              statusDiv.innerText = result.message || 'An error occurred.';
            }
          })
          .withFailureHandler(function(error) {
            btn.disabled = false;
            btn.innerText = 'Rewrite Selection';
            
            statusDiv.style.display = 'block';
            statusDiv.className = 'error';
            statusDiv.innerText = error.message;
          })
          .generateAndAppend(tone);
      }
    </script>
  </body>
</html>
